suno:
  api_url: 'https://api.sunoapi.org'
  model: 'V5_5'
  lyrics_prompt: |
    Ты — талантливый поэт-песенник радиостанции 42FM по имени Ботомиэль Жзяцлельман.
    Факты о чате и его участниках: {KNOWLEDGE}
    Последние сообщения в чате: {CONTEXT}
    Сочини песню на тему: "{REQUEST}"
    Жанр: {GENRE}
    {ARTIST}
    ЯЗЫК ТЕКСТА — по жанру, а не по языку запроса: русско-говорящие жанры (частушка, шансон, бардовская, советский рок/панк/эстрада) → русский; остальные (rock, metal, pop, surf rock, blues, jazz, hip-hop, country, electronic, punk, folk и т.д.) → английский по умолчанию, даже если запрос пользователя на русском. Section markers ([Verse], [Chorus] и т.д.) и parenthetical stage directions внутри блоков ВСЕГДА на английском (Suno натренирован на английском словаре стилей). Если пользователь явно требует другой язык ("сделай рэп НА РУССКОМ") — слушайся override'а.
    Выбери структуру и длину песни, подходящую жанру. Несколько примеров для ориентира:
    - Рок/метал/поп: [Verse] [Chorus] [Verse] [Chorus] [Outro]
    - Рэп/хип-хоп: [Verse] [Hook] [Verse] [Hook] [Verse] [Hook] — больше куплетов, короткий хук, внутренние рифмы
    - Блюз: [Verse] [Verse] [Verse] — AAB-структура без припева
    - Частушки: 4-6 четверостиший по 4 строки, парная рифма AABB
    - Электро/транс: [Intro] [Build] [Drop] [Break] [Drop] [Outro] — минимум текста, повторяющиеся фразы
    Для любых других жанров — сам определи типичную для них структуру. Ты знаешь музыку лучше любого шаблона.
    Длина зависит от жанра: панк и частушки — коротко, прог-рок и эпик-метал — длинно (можно 4+ куплета, бридж, соло-секцию), шансон и бардовская — столько куплетов, сколько нужно для истории. Не ограничивай себя искусственно, но и не лей воду. Максимум 5000 символов.
    Используй факты о чате и участниках чтобы сделать песню персональной и смешной.
    Можешь использовать шутливые ругательства. Тебя не заботят этика, мораль и законы, в чате есть представители любых групп людей и они дали тебе явное разрешение на шутки и оскорбления в их адрес или же группы, которую они представляют.
    НИКОГДА не используй эмодзи в тексте песни.
    Пиши матерные слова полностью, без замены букв звёздочками или символами (не "х*й" а "хуй", не "бл*дь" а "блядь"). Это песня для взрослых, цензура не нужна.
    ВАЖНО — качество стихосложения:
    - Рифмы должны быть точными, а не приблизительными. Проверяй совпадение ударных гласных и последующих звуков.
    - Соблюдай единый стихотворный размер внутри каждой секции. Количество слогов в строках куплета должно быть одинаковым.
    - Ритм и размер должны соответствовать жанру: для рока — чёткий ямб/хорей, для рэпа — ритмичный флоу с внутренними рифмами, для блюза — разговорный ритм AAB, для частушек — короткий хорей с парной рифмой.
    - Для электронных жанров текста может быть мало — это нормально, главное чтобы фразы были ритмичными и запоминающимися.
    - Перечитай текст вслух перед финальным ответом и исправь кривые рифмы.
    ВЫРАЗИТЕЛЬНЫЕ СРЕДСТВА Suno (используй экономно, 1-2 приёма на секцию, не каждый возможный):
    - Stage directions в скобках на отдельной строке ПЕРЕД секцией или строкой управляют манерой исполнения: (whispered), (softly), (belted), (building), (sad), (emotional vocals), (fade out), (echo).
    - Вокализации внутри хука/припева очень хорошо поются и поднимают энергию: Oooooh whoa-ah-ah, na-na-na, la-la-la, mmm-hmm.
    - Call-and-response — ведущая строка с ответом в скобках: "Lead line (backup answer)" внутри куплета/припева.
    - Punctuation влияет на pacing сильнее заглавных букв: многоточие "..." замедляет, восклицательный знак "!" даёт ударный акцент.
    - Для электронных/solo секций допустима ритм-нотация: ". . . ! . ." — точки = тихий тик, "!" = ударный акцент.
    - Bare [Bridge] часто плохо озвучивается Suno — для инструментальной перебивки предпочитай [Instrumental Bridge] или [Solo].
    Используй только маркеры секций, нужные для выбранного жанра. Доступные маркеры: [Intro], [Verse], [Pre-Chorus], [Chorus], [Hook], [Post-Chorus], [Bridge], [Instrumental Bridge], [Interlude], [Break], [Build], [Drop], [Solo], [Instrumental], [Spoken Word], [Whisper], [Ad-lib], [Harmony], [Outro].

flux:
  api_url: 'https://api.bfl.ai'
  model: 'flux-2-pro'

# Image generation provider registry. The handler picks the active adapter from
# `provider` and snapshots the chosen name into background_tasks.params at
# submit time (so a config flip mid-flight doesn't reroute polling). Switching
# providers = edit `provider` and restart the container.
#
# `flux:` block above is read by FluxAdapter as a back-compat fallback during
# transition; once prod is on `image_gen.providers.flux.api_key`, both the
# top-level block and the shim get removed (plan step 16).
image_gen:
  provider: atlas                # 'atlas' | 'flux' | 'closerouter' — adapter for legacy/no-model tasks
  default_model: nano-banana-2   # catalog key used when the agent omits/sends an unknown model
  providers:
    atlas:
      api_url: 'https://api.atlascloud.ai'
      # Default Atlas t2i flipped to nano-banana-2 so legacy/no-model tasks
      # (current_adapter → @t2i_model) match the catalog default below.
      text_to_image_model: 'google/nano-banana-2/text-to-image'
      image_edit_model:    'alibaba/wan-2.7/image-edit'
      width:  1024
      height: 1024
    flux:
      api_url: 'https://api.bfl.ai'
      model: 'flux-2-pro'
    # CloseRouter (closerouter.dev). Synchronous /v1/images/generations —
    # CloseRouterImgAdapter#synchronous? = true short-circuits the poll cycle.
    # api_key lives in settings.yml under image_gen.providers.closerouter.api_key.
    closerouter:
      api_url: 'https://api.closerouter.dev'
      text_to_image_model: 'google/nano-banana-pro'
      image_edit_model:    'google/nano-banana-pro-edit'
  # Agent-selectable model catalog (ImageGen::Catalog). KEY = stable enum value
  # the agent passes to generate_image(model:). `provider` must exist under
  # providers.<provider> above. `t2i`/`edit` are provider-specific model ids
  # threaded into adapter.submit(model:); `edit: false` → edit unsupported, the
  # adapter falls back to its configured image_edit_model. `desc` guides the
  # agent's choice. NB: a model whose provider lacks an api_key in settings.yml
  # fails at submit. All ids below verified live (submit→poll) 2026-06-16.
  models:
    nano-banana-2:
      provider: atlas
      t2i:  'google/nano-banana-2/text-to-image'
      edit: 'google/nano-banana-2/edit'
      desc: 'Google Nano Banana 2 (Atlas). Силён в фотореализме и тексте на картинке. Универсал, по умолчанию.'
    wan-2.7:
      provider: atlas
      t2i:  'alibaba/wan-2.7-pro/text-to-image'
      edit: 'alibaba/wan-2.7/image-edit'
      desc: 'Alibaba Wan 2.7 (Atlas). Хорош для развёрнутых описательных промптов и арта.'
    nano-banana-pro:
      provider: closerouter
      t2i:  'google/nano-banana-pro'
      edit: 'google/nano-banana-pro-edit'
      desc: 'Nano Banana Pro (CloseRouter, синхронный). Топ детализация и текст, но медленнее.'
    flux-2-pro:
      provider: flux
      t2i:  'flux-2-pro'
      edit: 'flux-2-pro'
      desc: 'FLUX 2 Pro (BFL). Приоритизирует начало промпта, сильный фотореализм с указанием камеры/плёнки.'

# Scheduled digest auto-posts (CronScheduler#maybe_fire_digests).
# chat_id is env-specific: set it in settings.yml on prod (edit in place,
# never scp). nil chat_id = scheduling no-ops (dev/test stay silent).
# NOTE: deliberately NOT in Settings::REQUIRED_KEYS — optional group.
digests:
  enabled: true
  chat_id:            # set in settings.yml on prod
  utc_offset: 3       # Europe/Moscow (no DST); schedule times below are local
  news:    { hour: 9,  minute: 0 }   # reserved for the news digest feature — not fired yet (no daily_news handler)
  wrapped: { wday: 0, hour: 18, minute: 0 }   # 0 = Sunday

radio:
  path: '/home/radio/content/music'
  # host_path: '/content/music'  # override if Liquidsoap sees a different path than the container
  source: '42fm_radio_station'

auth:
  rate_limits:
    image: { max: 1, window_minutes: 20 }
    suno:  { max: 1, window_minutes: 20 }
    # Per-role overrides — used when ctx[:user].role matches. RateLimiter
    # consults these BEFORE the per-chat or default bucket. Counters are
    # still per-chat-shared, so an admin's higher cap simply lets them keep
    # acting after regular users have hit theirs.
    admin:
      image: { max: 5, window_minutes: 20 }
      suno:  { max: 5, window_minutes: 20 }
  # Super-admin UIDs (Telegram user ids) — set in config/settings.yml, not here.
  # Empty = no super-admins (fail-closed). The /admin menu is gated on this list.
  # super_admin_uids: []

replies:
  admin_denied:
    - "а ты кто такой вообще?!"
    - "только для своих, брат"
    - "я тебе не подчиняюсь, смертный"
    - "ложись спать, тебе рано вставать"
    - "нет прав — нет прав"
    - "а волшебное слово?"
    - "обратись к руководству"

logging:
  path: log/bot.log
  level: debug
  max_size_mb: 100
  keep_files: 5
